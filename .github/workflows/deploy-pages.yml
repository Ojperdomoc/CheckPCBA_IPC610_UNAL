name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir --parents _site
          cp -R index.html .nojekyll Logo_UNAL.png assets vendor modelos muestras _site/
          # el modelo ONNX y los binarios de ONNX Runtime se publican tal cual
          test -f _site/modelos/checkpcba-solder.onnx
          test -f _site/vendor/ort-wasm-simd-threaded.wasm
          test -f _site/vendor/ort.wasm.min.js
          du -sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
